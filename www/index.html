<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MA'HAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Antonio:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="lcars-frame">
  <div class="elbow elbow-top" aria-hidden="true"></div>

  <header class="mahai-header">
    <div class="mahai-title">MA'HAI</div>
    <div class="mahai-subtitle">CENTRO DE LANZAMIENTO // APP HUB</div>
  </header>

  <main class="mahai-grid" id="grid">
    <button class="app-card card-orange" data-exe="NioBiologic.exe" data-label="NioBiologic">
      <span class="card-index">01</span>
      <span class="card-name">NIOBIOLOGIC</span>
      <span class="card-status" data-status></span>
    </button>

    <button class="app-card card-blue" data-exe="CaptainsLog.exe" data-label="Captain's Log">
      <span class="card-index">02</span>
      <span class="card-name">CAPTAIN'S LOG</span>
      <span class="card-status" data-status></span>
    </button>

    <button class="app-card card-violet" data-exe="PixelProcessor.exe" data-label="PixelProcessor">
      <span class="card-index">03</span>
      <span class="card-name">PIXELPROCESSOR</span>
      <span class="card-status" data-status></span>
    </button>

    <button class="app-card card-salmon" data-exe="AntiCloud.exe" data-label="AntiCloud">
      <span class="card-index">04</span>
      <span class="card-name">ANTICLOUD</span>
      <span class="card-status" data-status></span>
    </button>
  </main>

  <footer class="mahai-footer">
    <div class="footer-strip"></div>
    <div class="footer-text" id="footer-text">SISTEMA LISTO</div>
  </footer>

  <div class="elbow elbow-bottom" aria-hidden="true"></div>
</div>

<script src="script.js"></script>
</body>
</html>
