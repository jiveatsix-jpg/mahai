<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MA'HAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-icon" aria-hidden="true">&#9635;</span>
    <h1 class="logo">MA'HAI</h1>
    <span class="brand-sub">centro de lanzamiento v1.14.0</span>
  </div>
  <button class="btn-uninstall" id="uninstall-btn" title="Abre el desinstalador de Ma'hai">DESINSTALAR</button>
</header>

<main class="view">
  <h2 class="sec">APPS INSTALADAS</h2>

  <div class="grid" id="grid">
    <button class="pbox card card-red" data-exe="NioBiologic.exe" data-label="NioBiologic">
      <span class="tag red">01</span>
      <span class="card-title">NIOBIOLOGIC</span>
      <span class="card-desc">Terminal táctico de gráficos: líneas, barras, radar y distribución sobre tus datos.</span>
      <span class="card-meta" data-status>&nbsp;</span>
    </button>

    <button class="pbox card card-blue" data-exe="CaptainsLog.exe" data-label="Captain's Log">
      <span class="tag blue">02</span>
      <span class="card-title">CAPTAIN'S LOG</span>
      <span class="card-desc">Bitácora personal estilo LCARS, con dictado por voz y exportación a TXT/PDF.</span>
      <span class="card-meta" data-status>&nbsp;</span>
    </button>

    <button class="pbox card card-pink" data-exe="PixelProcessor.exe" data-label="PixelProcessor">
      <span class="tag pink">03</span>
      <span class="card-title">PIXELPROCESSOR</span>
      <span class="card-desc">Procesador de texto minimalista con estética pixel art y modo oscuro.</span>
      <span class="card-meta" data-status>&nbsp;</span>
    </button>

    <button class="pbox card card-green" data-exe="AntiCloud.exe" data-label="AntiCloud">
      <span class="tag green">04</span>
      <span class="card-title">ANTICLOUD</span>
      <span class="card-desc">Pizarra digital interactiva: arrastrá y personalizá elementos con estética pixel art.</span>
      <span class="card-meta" data-status>&nbsp;</span>
    </button>

    <button class="pbox card card-yellow" data-exe="Nyomcraft.exe" data-label="Nyomcraft">
      <span class="tag yellow">05</span>
      <span class="card-title">&Ntilde;OMCRAFT</span>
      <span class="card-desc">Recetario pixel: despensa de ingredientes, fichas de receta e índice buscable.</span>
      <span class="card-meta" data-status>&nbsp;</span>
    </button>

    <button class="pbox card card-cyan" data-exe="RedOps.exe" data-label="Red Ops Tracker">
      <span class="tag cyan">06</span>
      <span class="card-title">RED // OPS TRACKER</span>
      <span class="card-desc">Mapa de red de contactos: nodos, zonas y conexiones, con importación de GeoJSON.</span>
      <span class="card-meta" data-status>&nbsp;</span>
    </button>

    <button class="pbox card card-purple" data-exe="Breathe.exe" data-label="Activos Respiratorios">
      <span class="tag purple">07</span>
      <span class="card-title">ACTIVOS RESPIRATORIOS</span>
      <span class="card-desc">Guía de 12 técnicas de respiración con base científica para modular el sistema nervioso.</span>
      <span class="card-meta" data-status>&nbsp;</span>
    </button>

    <button class="pbox card card-orange" data-exe="ColtDrill.exe" data-label="Colt & Drill">
      <span class="tag orange">08</span>
      <span class="card-title">COLT & DRILL</span>
      <span class="card-desc">Quiz táctico de teoría musical: acordes, blues y escalas en un RPG de enemigos por niveles.</span>
      <span class="card-meta" data-status>&nbsp;</span>
    </button>

    <button class="pbox card card-lime" data-exe="MediaOps.exe" data-label="Media-Ops">
      <span class="tag lime">09</span>
      <span class="card-title">MEDIA-OPS</span>
      <span class="card-desc">Convertidor de formatos de imagen y audio: PNG, WebP, AVIF, GIF, TIFF y más.</span>
      <span class="card-meta" data-status>&nbsp;</span>
    </button>

    <button class="pbox card card-magenta" data-exe="AeterCalendar.exe" data-label="AETER Calendar">
      <span class="tag magenta">10</span>
      <span class="card-title">AETER CALENDAR</span>
      <span class="card-desc">Calendario estilo terminal con paletas de color y eventos persistentes.</span>
      <span class="card-meta" data-status>&nbsp;</span>
    </button>

    <button class="pbox card card-gold" data-exe="RetroDarts.exe" data-label="Retro Darts 420">
      <span class="tag gold">11</span>
      <span class="card-title">RETRO DARTS 420</span>
      <span class="card-desc">Juego neón de puntaje de dardos, estética retro.</span>
      <span class="card-meta" data-status>&nbsp;</span>
    </button>
  </div>
</main>

<footer class="statusbar">
  <span id="footer-text">SISTEMA LISTO</span>
  <span>MASTERSOFTHECODE // JIVEATSIX</span>
</footer>

<script src="script.js"></script>
</body>
</html>
