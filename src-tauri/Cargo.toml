[package]
name = "mahai"
version = "1.0.0"
description = "Ma'hai - Centro de lanzamiento LCARS"
edition = "2021"

[lib]
name = "mahai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
